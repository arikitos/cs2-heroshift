name: Recreate v1.0.0 Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "${{ github.event.head_commit.message == 'chore: release v1.0.0' }}"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore -p:Version=1.0.0

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Version v1.0.0 -OutputDirectory artifacts -NoBuild

      - name: Replace tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --repo '${{ github.repository }}' --yes
          git push origin :refs/tags/v1.0.0
          git tag --delete v1.0.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate v1.0.0 --message 'HeroShift v1.0.0' '${{ github.sha }}'
          git push origin refs/tags/v1.0.0
          gh release create v1.0.0 'artifacts/HeroShift-v1.0.0.zip' `
            --repo '${{ github.repository }}' `
            --verify-tag `
            --title 'HeroShift v1.0.0' `
            --generate-notes

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroShift-v1.0.0
          path: artifacts/HeroShift-v1.0.0.zip
          if-no-files-found: error
