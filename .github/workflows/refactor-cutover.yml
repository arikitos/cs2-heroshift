name: Refactor Runtime Cutover

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refactor-runtime-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- cutover:runtime-config -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Decode reviewed patch
        shell: bash
        run: |
          cat tools/refactor-cutover/runtime-config.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > runtime-config.patch

      - name: Apply reviewed patch
        shell: bash
        run: |
          git apply --check --exclude=CHANGELOG.md runtime-config.patch
          git apply --exclude=CHANGELOG.md runtime-config.patch
          rm runtime-config.patch
          rm tools/refactor-cutover/runtime-config.patch.gz.b64.part*

          python3 - <<'PY'
          from pathlib import Path

          skills_info = Path('HeroShift - SRC Files/src/utils/SkillsInfo.cs')
          text = skills_info.read_text(encoding='utf-8')
          if 'using src.player;' not in text:
              text = text.replace('using src.SkillsCore;\n', 'using src.SkillsCore;\nusing src.player;\n', 1)
          skills_info.write_text(text, encoding='utf-8')

          option_set = Path('HeroShift - SRC Files/src/Skills/Abstractions/SkillOptionSet.cs')
          text = option_set.read_text(encoding='utf-8')
          if 'interface IMaxDistanceOptions' not in text:
              text = text.replace(
                  'public interface ISkillOptions\n{\n}\n',
                  'public interface ISkillOptions\n{\n}\n\npublic interface IMaxDistanceOptions : ISkillOptions\n{\n    float MaxDistance { get; }\n}\n',
                  1)
          option_set.write_text(text, encoding='utf-8')

          skill_runtime = Path('HeroShift - SRC Files/src/Skills/SkillRuntime.cs')
          text = skill_runtime.read_text(encoding='utf-8')
          if 'GetMaxDistance' not in text:
              text = text.replace(
                  '    public static SkillId GetId(Skills skill) => Current.Skills.Get(skill).Id;\n',
                  '    public static SkillId GetId(Skills skill) => Current.Skills.Get(skill).Id;\n\n'
                  '    public static float GetMaxDistance(Skills skill) =>\n'
                  '        Current.Skills.Get(skill).Options is IMaxDistanceOptions options\n'
                  '            ? options.MaxDistance\n'
                  '            : 0f;\n',
                  1)
          skill_runtime.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')

          changed = '- Cut runtime configuration over to atomic `heroshift.json` snapshots with canonical typed global defaults, per-skill metadata/options binding, explicit legacy-ID mapping, and embedded-English localization fallback.'
          if changed not in text:
              text = text.replace('### Changed\n\n', f'### Changed\n\n{changed}\n\n', 1)

          removed = '- Stop reading `config.json` and `skillsInfo.json` at runtime; the files remain only until the dedicated legacy-cleanup checkpoint removes obsolete artifacts and nested compatibility models.'
          if removed not in text:
              text = text.replace('### Fixed\n', f'### Removed\n\n{removed}\n\n### Fixed\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test -n "$(git status --porcelain)" || { echo 'Cutover produced no changes' >&2; exit 1; }

      - name: Validate runtime cutover invariants
        shell: bash
        run: |
          set -euo pipefail

          require_file() {
            test -f "$1" || { echo "::error file=$1::Required cutover file is missing"; exit 1; }
          }

          require_text() {
            local file="$1"
            local text="$2"
            grep -Fq -- "$text" "$file" || {
              echo "::error file=$file::Required cutover initialization is missing: $text"
              exit 1
            }
          }

          forbid_text() {
            local file="$1"
            local text="$2"
            if grep -Fq -- "$text" "$file"; then
              grep -Fn -- "$text" "$file" || true
              echo "::error file=$file::Legacy cutover dependency remains: $text"
              exit 1
            fi
          }

          require_file "HeroShift - SRC Files/src/Configuration/ConfigurationStore.cs"
          require_file "HeroShift - Server Files/plugins/HeroShift/configs/heroshift.json"
          forbid_text "HeroShift - SRC Files/src/utils/Config.cs" "JsonConvert"
          forbid_text "HeroShift - SRC Files/src/utils/SkillsInfo.cs" "System.Reflection"
          require_text "HeroShift - SRC Files/src/HeroShift.cs" "Config.Initialize(BuiltInSkillCatalog.BuildRegistry())"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit runtime cutover checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: cut over to typed runtime configuration'
          git push origin HEAD:refactor

      - name: Clear cutover request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- cutover:runtime-config -->', '<!-- cutover:runtime-config-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
