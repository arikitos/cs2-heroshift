name: Refactor Global Config Cleanup

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-config:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- cleanup:config -->')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Apply typed global configuration cleanup
        shell: bash
        run: |
          set -euo pipefail
          payload='/tmp/config.patch.gz.b64'
          cat tools/refactor-cleanup/config.patch.gz.b64.* > "$payload"
          printf '%s  %s\n' 'aa5f3659f8269d55fb70a5e02a2e5df52723a0bb9d6903f3fc2d8fd925884340' "$payload" | sha256sum --check --status
          base64 --decode "$payload" | gzip --decompress > /tmp/config-cleanup.patch
          git apply --index /tmp/config-cleanup.patch
          sed -i 's/new CommandDefinition(name, description, handler)/new CounterStrikeSharp.API.Core.Commands.CommandDefinition(name, description, handler)/' 'HeroShift - SRC Files/src/HeroShift.cs'
          git add 'HeroShift - SRC Files/src/HeroShift.cs'
          python3 - <<'PYCHANGELOG'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- Remove the final `Config` compatibility facade; all runtime consumers now read the canonical immutable typed configuration snapshot directly, including typed command aliases, permissions and game modes.\n\n'
          if entry not in text:
              text = text.replace('### Changed\n\n', '### Changed\n\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
          PYCHANGELOG
          git rm tools/refactor-cleanup/config.patch.gz.b64.* '.github/workflows/refactor-config-cleanup.yml'
          git add CHANGELOG.md
          git diff --cached --check

      - name: Validate configuration invariants
        shell: bash
        run: |
          set -euo pipefail
          source_root='HeroShift - SRC Files/src'
          store="$source_root/Configuration/ConfigurationStore.cs"
          command="$source_root/command/Command.cs"
          hero="$source_root/HeroShift.cs"
          tests='HeroShift - SRC Files/tests/HeroShift.Tests/ConfigurationStoreTests.cs'

          test ! -e "$source_root/utils/Config.cs"
          grep -Fq 'public static HeroShiftConfiguration Settings => Current.Configuration;' "$store"
          grep -Fq 'ConfigurationStore.Initialize(Path.Combine(ModuleDirectory, "configs", "heroshift.json"), SkillRegistry, Logger);' "$hero"
          grep -Fq 'Assert.Same(snapshot.Configuration, ConfigurationStore.Settings);' "$tests"
          grep -Fq 'config.Commands.SetSkillCommand.Aliases' "$command"
          grep -Fq 'config.Voting.StartGameCommand.Permission' "$command"

          if grep -RIn --include='*.cs' -E '\bConfig\.(LoadedConfig|GameModes|SettingsModel|LoadConfig|Initialize)|public static class Config([[:space:]]|$)' "$source_root"; then
            echo '::error::Legacy global Config facade reference remains'
            exit 1
          fi

          if grep -E 'SplitCommands\(|\.NormalCommands\.|\.VotingCommands\.|\.Permissions\b|\.Alias\b' "$command"; then
            echo '::error file=HeroShift - SRC Files/src/command/Command.cs::Legacy command configuration shape remains'
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Validate package after build
        shell: bash
        run: |
          set -euo pipefail
          hero='HeroShift - SRC Files/src/HeroShift.cs'
          test -f 'HeroShift - Server Files/plugins/HeroShift/HeroShift.dll'
          test -f 'HeroShift - Server Files/plugins/HeroShift/WASDMenuAPI.dll'
          test -f 'HeroShift - Server Files/plugins/HeroShift/Newtonsoft.Json.dll'
          test -f 'HeroShift - Server Files/gamedata/HeroShift.gamedata.json'
          test -f 'HeroShift - Server Files/plugins/HeroShift/configs/heroshift.json'
          test -f 'HeroShift - SRC Files/libs/RayTraceApi.dll'
          grep -Fq '{ "RayTraceApi", "./../../shared/RayTraceApi/RayTraceApi.dll" }' "$hero"
          grep -Fq '{ "RayTraceImpl", "./../../plugins/RayTraceImpl/RayTraceImpl.dll" }' "$hero"
          grep -Fq '{ "RayTrace MetaMod", "./../../../metamod/RayTrace.vdf" }' "$hero"

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: remove legacy global configuration facade'
          git push origin HEAD:refactor

      - name: Clear cleanup request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- cleanup:config -->', '<!-- cleanup:config-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
