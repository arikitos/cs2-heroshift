name: Refactor Runtime Adapters V2

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  adapters:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- adapters:runtime-v2 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Decode and validate adapter patch
        shell: bash
        run: |
          set -euo pipefail
          payload='tools/refactor-adapters/adapters.patch.gz.b64'
          base64 --decode "$payload" > /tmp/adapters.patch.gz
          gzip --test /tmp/adapters.patch.gz
          gzip --decompress --stdout /tmp/adapters.patch.gz > /tmp/adapters.patch
          grep -Fq 'Subject: [PATCH] refactor: isolate runtime dependency adapters' /tmp/adapters.patch
          grep -Fq 'src/Infrastructure/Menu/IGameMenuService.cs' /tmp/adapters.patch
          grep -Fq 'src/Infrastructure/Tracing/ITraceService.cs' /tmp/adapters.patch
          grep -Fq 'tests/HeroShift.Tests/RuntimeAdapterTests.cs' /tmp/adapters.patch
          git apply --index /tmp/adapters.patch
          git rm -r tools/refactor-adapters '.github/workflows/refactor-adapters.yml' '.github/workflows/refactor-adapters-v2.yml'
          git diff --cached --check

      - name: Validate adapter invariants
        shell: bash
        run: |
          set -euo pipefail
          source_root='HeroShift - SRC Files/src'
          hero="$source_root/HeroShift.cs"
          menu="$source_root/Infrastructure/Menu/WasdGameMenuService.cs"
          trace="$source_root/Infrastructure/Tracing/RayTraceService.cs"
          tests='HeroShift - SRC Files/tests/HeroShift.Tests/RuntimeAdapterTests.cs'

          test -f "$source_root/Infrastructure/Menu/IGameMenuService.cs"
          test -f "$menu"
          test -f "$source_root/Infrastructure/Tracing/ITraceService.cs"
          test -f "$trace"
          grep -Fq 'MenuService = new WasdGameMenuService();' "$hero"
          grep -Fq 'TraceService = new RayTraceService();' "$hero"
          grep -Fq 'new("raytrace:craytraceinterface")' "$trace"
          grep -Fq 'WASDMenuAPI.WASDMenuAPI.LoadPlugin(plugin, hotReload);' "$menu"
          grep -Fq 'WasdAdapterCreatesManagerLazilyAndDelegatesOperations' "$tests"
          grep -Fq 'TraceAdapterLogsMissingCapabilityOnlyOnce' "$tests"

          direct_menu=$(grep -RIl --include='*.cs' 'new WasdManager' "$source_root" | grep -v '/Infrastructure/Menu/WasdGameMenuService.cs' || true)
          test -z "$direct_menu" || { printf '%s\n' "$direct_menu"; exit 1; }

          if grep -RIn --include='*.cs' -E 'RayTrace\.(TraceShape|EyeTrace|TraceHullShape|IsAvailable)' "$source_root"; then
            echo '::error::Direct static RayTrace calls remain'
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Validate deployment contract
        shell: bash
        run: |
          set -euo pipefail
          hero='HeroShift - SRC Files/src/HeroShift.cs'
          test -f 'HeroShift - Server Files/plugins/HeroShift/HeroShift.dll'
          test -f 'HeroShift - Server Files/plugins/HeroShift/WASDMenuAPI.dll'
          test -f 'HeroShift - Server Files/plugins/HeroShift/Newtonsoft.Json.dll'
          test -f 'HeroShift - Server Files/gamedata/HeroShift.gamedata.json'
          test -f 'HeroShift - Server Files/plugins/HeroShift/configs/heroshift.json'
          test -f 'HeroShift - SRC Files/libs/RayTraceApi.dll'
          grep -Fq '{ "RayTraceApi", "./../../shared/RayTraceApi/RayTraceApi.dll" }' "$hero"
          grep -Fq '{ "RayTraceImpl", "./../../plugins/RayTraceImpl/RayTraceImpl.dll" }' "$hero"
          grep -Fq '{ "RayTrace MetaMod", "./../../../metamod/RayTrace.vdf" }' "$hero"

      - name: Commit adapters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: isolate runtime dependency adapters'
          git push origin HEAD:refactor

      - name: Clear adapter request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- adapters:runtime-v2 -->', '<!-- adapters:runtime-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
