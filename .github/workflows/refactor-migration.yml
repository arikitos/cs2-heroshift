name: Refactor Skill Migration

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refactor-skill-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- migrate:batch-')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve requested batch
        id: request
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          batch="$(printf '%s' "$PR_BODY" | sed -n 's/.*<!-- migrate:\(batch-[a-z]\) -->.*/\1/p' | head -n1)"
          case "$batch" in
            batch-a|batch-b|batch-c|batch-d|batch-e|batch-g) ;;
            *) echo "Unsupported or missing migration batch" >&2; exit 1 ;;
          esac
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          case "$batch" in
            batch-a) message='refactor: migrate passive skills to typed options' ;;
            batch-b) message='refactor: migrate tick and movement skills' ;;
            batch-c) message='refactor: migrate damage pipeline skills' ;;
            batch-d) message='refactor: migrate entity and grenade skills' ;;
            batch-e) message='refactor: migrate RayTrace skills' ;;
            batch-g) message='refactor: migrate remaining complex skills' ;;
          esac
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate typed skill batch
        run: python3 tools/refactor-migration/generate_skill_batch.py "${{ steps.request.outputs.batch }}"

      - name: Validate generated diff
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --porcelain)" || { echo 'Migration produced no changes' >&2; exit 1; }

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit migration checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CHANGELOG.md \
            "HeroShift - SRC Files/src/Skills" \
            "HeroShift - SRC Files/src/player/skills" \
            "HeroShift - SRC Files/tests/HeroShift.Tests/BuiltInSkillCatalogTests.cs"
          git commit -m "${{ steps.request.outputs.message }}"
          git push origin HEAD:refactor

      - name: Clear migration request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace(/<!-- migrate:batch-[a-z] -->/g, '<!-- migrate:complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
