name: Refactor Tick Routing

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  tick-routing:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- dispatch:tick-routing -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Route tick loop through typed dispatcher
        shell: bash
        run: |
          python3 tools/refactor-dispatch/apply_tick_routing.py
          rm tools/refactor-dispatch/apply_tick_routing.py
          git diff --check

      - name: Validate tick routing
        shell: bash
        run: |
          dispatcher='HeroShift - SRC Files/src/Skills/SkillDispatcher.cs'
          player='HeroShift - SRC Files/src/player/PlayerEvents.cs'
          tests='HeroShift - SRC Files/tests/HeroShift.Tests/SkillDispatcherTests.cs'
          grep -Fq 'public void InvokeTickUnchecked(SkillId skillId)' "$dispatcher"
          grep -Fq 'InvokeTickUnchecked(SkillRuntime.GetId(skill))' "$player"
          grep -Fq 'tickFailuresLogged.Add(skill)' "$player"
          grep -Fq '_activeSkillsList.Sort(_tickOrderCmp)' "$player"
          grep -Fq '_freezeDisabledSkills.Contains(skill)' "$player"
          grep -Fq 'InvokeTickUnchecked_PropagatesHookFailureToCaller' "$tests"
          if grep -Fq '_skillNames' "$player"; then exit 1; fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit tick routing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: route tick hooks through typed dispatcher'
          git push origin HEAD:refactor

      - name: Clear tick routing request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- dispatch:tick-routing -->', '<!-- dispatch:tick-routing-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
