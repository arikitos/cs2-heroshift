name: Refactor Damage Routing

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  damage-routing:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- dispatch:damage-routing -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Route damage pipeline through typed dispatcher
        shell: bash
        run: |
          python3 tools/refactor-dispatch/apply_damage_routing.py
          rm tools/refactor-dispatch/apply_damage_routing.py
          git diff --check

      - name: Validate damage routing
        shell: bash
        run: |
          file='HeroShift - SRC Files/src/player/PlayerEvents.cs'
          grep -Fq 'DispatchOnTakeDamage([SkillRuntime.GetId(skill)], h, post)' "$file"
          grep -Fq 'lateDamageSkills' "$file"
          grep -Fq '[DMG]' "$file"
          if grep -Fq 'post ? "OnTakeDamagePost" : "OnTakeDamage"' "$file"; then exit 1; fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit damage routing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: route damage hooks through typed dispatcher'
          git push origin HEAD:refactor

      - name: Clear damage routing request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- dispatch:damage-routing -->', '<!-- dispatch:damage-routing-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
