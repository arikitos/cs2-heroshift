name: Refactor Legacy Scan

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: read

jobs:
  legacy-scan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- dispatch:legacy-scan -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: List remaining legacy dispatch and configuration references
        shell: bash
        run: |
          source_root='HeroShift - SRC Files/src'

          echo '::group::SkillAction references'
          grep -RIn --include='*.cs' 'SkillAction(' "$source_root" || true
          echo '::endgroup::'

          echo '::group::String hook-name references'
          grep -RIn --include='*.cs' -E '"(LoadSkill|EnableSkill|DisableSkill|UseSkill|TypeSkill|NewRound|RoundEnd)"' "$source_root" || true
          echo '::endgroup::'

          echo '::group::SkillsInfo runtime references'
          grep -RIn --include='*.cs' 'SkillsInfo' "$source_root" || true
          echo '::endgroup::'

          echo '::group::Nested SkillConfig declarations'
          grep -RIn --include='*.cs' 'class SkillConfig' "$source_root" || true
          echo '::endgroup::'

          echo '::group::Legacy JSON references'
          grep -RIn -E 'config\.json|skillsInfo\.json|languages/en\.json|src/lang/en\.json' . \
            --exclude-dir=.git --exclude='*.patch' --exclude='*.b64' || true
          echo '::endgroup::'
