name: Refactor Disconnect Hooks

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refactor-disconnect-hooks
  cancel-in-progress: false

jobs:
  disconnect-hooks:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- dispatch:disconnect-hooks -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Restore typed disconnect hooks
        shell: bash
        run: |
          base64 --decode tools/refactor-dispatch/disconnect-hooks.patch.gz.b64 \
            | gzip --decompress > disconnect-hooks.patch
          git apply --check disconnect-hooks.patch
          git apply disconnect-hooks.patch
          rm disconnect-hooks.patch
          rm tools/refactor-dispatch/disconnect-hooks.patch.gz.b64

          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- Preserve player-disconnect cleanup for all 19 stateful skills by registering and invoking the typed `PlayerDisconnect` hook.'
          if entry not in text:
              text = text.replace('### Fixed\n\n', f'### Fixed\n\n{entry}\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Validate disconnect hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'public Action<uint>? PlayerDisconnect' 'HeroShift - SRC Files/src/Skills/Abstractions/SkillHookSet.cs'
          grep -Fq 'nameof(SkillHookSet.PlayerDisconnect)' 'HeroShift - SRC Files/src/HeroShift.cs'
          count=$(grep -R -l 'PlayerDisconnect = .*\.PlayerDisconnect' 'HeroShift - SRC Files/src/Skills/BuiltIn' | wc -l)
          test "$count" -eq 19 || { echo "Expected 19 disconnect registrations, found $count"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit disconnect hook restoration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve skill disconnect hooks'
          git push origin HEAD:refactor

      - name: Clear disconnect request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- dispatch:disconnect-hooks -->', '<!-- dispatch:disconnect-hooks-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
