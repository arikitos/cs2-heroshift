name: Refactor Dispatcher API

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refactor-dispatcher-api
  cancel-in-progress: false

jobs:
  dispatcher-api:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- dispatch:api -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Add complete typed dispatcher API
        shell: bash
        run: |
          base64 --decode tools/refactor-dispatch/dispatcher-api.patch.gz.b64 \
            | gzip --decompress > dispatcher-api.patch
          git apply --check dispatcher-api.patch
          git apply dispatcher-api.patch
          rm dispatcher-api.patch
          rm tools/refactor-dispatch/dispatcher-api.patch.gz.b64

          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- Add typed dispatcher APIs for skill lifecycle, disconnect, entity, team, bomb, decoy, smoke and trigger hooks before migrating live event call sites.'
          if entry not in text:
              text = text.replace('### Added\n\n', f'### Added\n\n{entry}\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Validate dispatcher API
        shell: bash
        run: |
          set -euo pipefail
          file='HeroShift - SRC Files/src/Skills/SkillDispatcher.cs'
          grep -Fq 'public void InvokeLoadSkill' "$file"
          grep -Fq 'public void InvokeEnableSkill' "$file"
          grep -Fq 'public void DispatchPlayerDisconnect' "$file"
          grep -Fq 'public void DispatchOnEntitySpawned' "$file"
          grep -Fq 'public void DispatchBombPlanted' "$file"
          grep -Fq 'public void DispatchSmokegrenadeExpired' "$file"
          grep -Fq 'public void DispatchOnTriggerEnter' "$file"
          tests='HeroShift - SRC Files/tests/HeroShift.Tests/SkillDispatcherTests.cs'
          grep -Fq 'InvokeLifecycle_CallsOnlyRequestedSkillInOrder' "$tests"
          grep -Fq 'DispatchWorldHooks_RoutesTypedArguments' "$tests"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit dispatcher API
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete typed dispatcher api'
          git push origin HEAD:refactor

      - name: Clear dispatcher API request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- dispatch:api -->', '<!-- dispatch:api-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
