name: Refactor Entity Routing

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  entity-routing:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- dispatch:entity-routing -->')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Apply entity routing patch
        shell: bash
        run: |
          base64 --decode tools/refactor-dispatch/entity-routing.patch.gz.b64 | gzip --decompress > entity-routing.patch
          git apply --check entity-routing.patch
          git apply entity-routing.patch
          rm entity-routing.patch tools/refactor-dispatch/entity-routing.patch.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- Route entity, objective, grenade, trigger, weapon-acquisition and transmit callbacks through the typed dispatcher while preserving active-skill ordering and Fortnite wall damage handling.'
          if entry not in text:
              text = text.replace('### Changed\n\n', f'### Changed\n\n{entry}\n\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Validate entity routing
        shell: bash
        run: |
          grep -Fq 'private static IReadOnlyList<SkillId> GetActiveSkillIds()' 'HeroShift - SRC Files/src/player/PlayerEvents.cs'
          grep -Fq 'DispatchOnWeaponCanAcquire(' 'HeroShift - SRC Files/src/player/EntityEvents.cs'
          grep -Fq 'DispatchOnEntitySpawned(' 'HeroShift - SRC Files/src/player/EntityEvents.cs'
          grep -Fq 'DispatchCheckTransmit(' 'HeroShift - SRC Files/src/player/EntityEvents.cs'
          grep -Fq 'BuiltInSkillIds.Fortnite' 'HeroShift - SRC Files/src/player/EntityEvents.cs'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Commit entity routing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: route entity events through typed dispatcher'
          git push origin HEAD:refactor

      - name: Clear entity routing request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- dispatch:entity-routing -->', '<!-- dispatch:entity-routing-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
