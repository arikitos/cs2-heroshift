name: Refactor Runtime Adapters V4

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  adapters:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor' &&
      github.event.pull_request.user.login == 'arikitos' &&
      contains(github.event.pull_request.body || '', '<!-- adapters:runtime-v4 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Apply verified adapter patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/refactor-adapters/raw/* > /tmp/adapters.patch
          printf '%s  %s\n' '89413803091179c747d3dc0f107bb1d7ce151b6c3b908d870e81d607ece30f53' /tmp/adapters.patch | sha256sum --check --status
          git apply --check /tmp/adapters.patch
          git apply --index /tmp/adapters.patch

          menu='HeroShift - SRC Files/src/Infrastructure/Menu/WasdGameMenuService.cs'
          test_project='HeroShift - SRC Files/tests/HeroShift.Tests/HeroShift.Tests.csproj'
          sed -i 's/managerFactory ?? static () => new WasdManager()/managerFactory ?? (static () => new WasdManager())/' "$menu"
          sed -i '/<\/Project>/i\
            <ItemGroup>\
              <Reference Include="RayTraceApi">\
                <HintPath>..\\..\\libs\\RayTraceApi.dll</HintPath>\
                <Private>false</Private>\
              </Reference>\
            </ItemGroup>\
          ' "$test_project"

          git add "$menu" "$test_project"
          git rm -r tools/refactor-adapters '.github/workflows/refactor-adapters-v2.yml' '.github/workflows/refactor-adapters-v4.yml'
          git diff --cached --check

      - name: Validate adapter invariants
        shell: bash
        run: |
          set -euo pipefail
          source_root='HeroShift - SRC Files/src'
          hero="$source_root/HeroShift.cs"
          menu="$source_root/Infrastructure/Menu/WasdGameMenuService.cs"
          trace="$source_root/Infrastructure/Tracing/RayTraceService.cs"
          tests='HeroShift - SRC Files/tests/HeroShift.Tests/RuntimeAdapterTests.cs'
          test_project='HeroShift - SRC Files/tests/HeroShift.Tests/HeroShift.Tests.csproj'

          test -f "$source_root/Infrastructure/Menu/IGameMenuService.cs"
          test -f "$source_root/Infrastructure/Tracing/ITraceService.cs"
          grep -Fq 'MenuService = new WasdGameMenuService();' "$hero"
          grep -Fq 'TraceService = new RayTraceService();' "$hero"
          grep -Fq 'managerFactory ?? (static () => new WasdManager())' "$menu"
          grep -Fq 'new("raytrace:craytraceinterface")' "$trace"
          grep -Fq 'WASDMenuAPI.WASDMenuAPI.LoadPlugin(plugin, hotReload);' "$menu"
          grep -Fq 'WasdAdapterCreatesManagerLazilyAndDelegatesOperations' "$tests"
          grep -Fq 'TraceAdapterLogsMissingCapabilityOnlyOnce' "$tests"
          grep -Fq '<Reference Include="RayTraceApi">' "$test_project"
          grep -Fq '<HintPath>..\..\libs\RayTraceApi.dll</HintPath>' "$test_project"

          direct_menu=$(grep -RIl --include='*.cs' 'new WasdManager' "$source_root" | grep -v '/Infrastructure/Menu/WasdGameMenuService.cs' || true)
          test -z "$direct_menu" || { printf '%s\n' "$direct_menu"; exit 1; }
          ! grep -RIn --include='*.cs' -E 'RayTrace\.(TraceShape|EyeTrace|TraceHullShape|IsAvailable)' "$source_root"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Validate deployment contract
        shell: bash
        run: |
          set -euo pipefail
          hero='HeroShift - SRC Files/src/HeroShift.cs'
          test -f 'HeroShift - Server Files/plugins/HeroShift/HeroShift.dll'
          test -f 'HeroShift - Server Files/plugins/HeroShift/WASDMenuAPI.dll'
          test -f 'HeroShift - Server Files/plugins/HeroShift/Newtonsoft.Json.dll'
          test -f 'HeroShift - Server Files/gamedata/HeroShift.gamedata.json'
          test -f 'HeroShift - Server Files/plugins/HeroShift/configs/heroshift.json'
          test -f 'HeroShift - SRC Files/libs/RayTraceApi.dll'
          grep -Fq '{ "RayTraceApi", "./../../shared/RayTraceApi/RayTraceApi.dll" }' "$hero"
          grep -Fq '{ "RayTraceImpl", "./../../plugins/RayTraceImpl/RayTraceImpl.dll" }' "$hero"
          grep -Fq '{ "RayTrace MetaMod", "./../../../metamod/RayTrace.vdf" }' "$hero"

      - name: Commit adapters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: isolate runtime dependency adapters'
          git push origin HEAD:refactor

      - name: Clear adapter request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body.replace('<!-- adapters:runtime-v4 -->', '<!-- adapters:runtime-complete -->');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned,
            });
