name: Refactor Validation

on:
  workflow_dispatch:
  push:
    branches: [refactor]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: refactor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Package twice
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Configuration Release -Version ci -OutputDirectory artifacts/first -NoBuild
          ./scripts/package.ps1 -Configuration Release -Version ci -OutputDirectory artifacts/second -NoBuild

          $first = Get-FileHash -Algorithm SHA256 -LiteralPath 'artifacts/first/HeroShift-ci.zip'
          $second = Get-FileHash -Algorithm SHA256 -LiteralPath 'artifacts/second/HeroShift-ci.zip'
          if ($first.Hash -ne $second.Hash) {
            throw "Package is not deterministic: $($first.Hash) != $($second.Hash)"
          }

          $manifest = Get-Content -Raw -LiteralPath 'artifacts/first/stage/HeroShift-ci/package-manifest.json' | ConvertFrom-Json
          $expected = @(
            'gamedata/HeroShift.gamedata.json',
            'plugins/HeroShift/HeroShift.dll',
            'plugins/HeroShift/Newtonsoft.Json.dll',
            'plugins/HeroShift/WASDMenuAPI.dll',
            'plugins/HeroShift/configs/heroshift.json'
          ) | Sort-Object
          $actual = @($manifest.files.path) | Sort-Object
          if (Compare-Object $expected $actual) { throw 'Package manifest inventory is invalid.' }

      - name: Validate architecture and legacy removal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          source_root='HeroShift - SRC Files/src'
          test "$(grep -c 'registry.Register(' "$source_root/Skills/BuiltInSkillCatalog.cs")" -eq 142
          ! grep -RIn --include='*.cs' -E '\bSkillsInfo\b|\bSkillAction\b|MethodInfo\.Invoke|public class SkillConfig\b|public static class Config([[:space:]]|$)' "$source_root"
          test ! -e 'HeroShift - Server Files'
          test -f 'packaging/HeroShift/configs/heroshift.json'
          test -f "$source_root/Localization/Resources/en.json"
          test ! -e "$source_root/lang/en.json"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HeroShift-${{ runner.os }}
          path: artifacts/first/HeroShift-ci.zip
          if-no-files-found: error
