name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Determine tag
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout ${{ steps.vars.outputs.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "HeroShift - SRC Files/HeroShift.sln"

      - name: Test
        run: dotnet test "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Build
        run: dotnet build "HeroShift - SRC Files/HeroShift.sln" -c Release --no-restore

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Version '${{ steps.vars.outputs.tag }}' -OutputDirectory artifacts -NoBuild

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroShift-${{ steps.vars.outputs.tag }}
          path: artifacts/HeroShift-${{ steps.vars.outputs.tag }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.vars.outputs.tag }}' 'artifacts/HeroShift-${{ steps.vars.outputs.tag }}.zip' `
            --verify-tag `
            --title 'HeroShift ${{ steps.vars.outputs.tag }}' `
            --generate-notes
